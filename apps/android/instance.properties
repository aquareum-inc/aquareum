# What is fixed when the app is built: which instance it belongs to. `./livepeer mobile` writes this file
# from instance.config.json. Everything else about the instance is read from it at run time.
# These values point a development build at a local mock-only instance (`MOCK_ONLY=1 pnpm dev`);
# 10.0.2.2 is how the Android emulator reaches the machine it runs on.
name=Livepeer
applicationId=org.livepeer.app.dev
url=http://10.0.2.2:3100

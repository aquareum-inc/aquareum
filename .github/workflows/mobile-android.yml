name: Mobile Android

# The Android app, built and tested against a mock-only instance (docs/mobile/plan.md section 14).
# Not a required check until it is stable.
#
# Same rule as iOS: it runs when a pull request that touches the Android app (or what it shares with iOS) is
# opened or marked ready for review, and when asked, by adding the run-android label or starting it by hand.
# Not on every push: changes are built and tested on an emulator locally before they're pushed. Not after
# merging either.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, labeled]
    paths:
      - "apps/android/**"
      - "packages/mobile-codegen/src/**"
      - "docs/mobile/openapi.json"
      - "docs/mobile/dev.instance.config.json"
      - "apps/web/lib/public-api/**"
      - ".github/workflows/mobile-android.yml"
  workflow_dispatch:

# Queued, not cancelled: a label that doesn't ask for a run would otherwise cancel one that's under way.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  MOCK_ONLY: "1"
  INSTANCE_CONFIG: docs/mobile/dev.instance.config.json

jobs:
  android:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'run-android') ||
      (github.event.action != 'labeled' && !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Android 17 is published as 37.0 (platforms;android-37.0).
      API_LEVEL: "37.0"
      EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Gradle's own caching: dependencies and build outputs carry over between runs.
      - uses: gradle/actions/setup-gradle@v4
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Start a mock-only instance
        run: |
          export SESSION_SECRET="$(openssl rand -hex 32)"
          nohup pnpm dev > instance.log 2>&1 &
          curl -fsS --retry 60 --retry-delay 2 --retry-all-errors http://localhost:3100/api/v1/instance > /dev/null
      - name: Unit tests
        working-directory: apps/android
        run: ./gradlew testDebugUnitTest
      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # A booted emulator, saved once and restored on later runs, instead of a cold boot every time.
      - name: Restore the emulator
        id: avd
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-google_apis-x86_64
      - name: Save a booted emulator
        if: steps.avd.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          disable-animations: false
          script: echo "Saved a booted emulator."
      - name: UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          working-directory: apps/android
          script: ./gradlew connectedDebugAndroidTest
      - name: Instance log
        if: failure()
        run: tail -n 200 instance.log

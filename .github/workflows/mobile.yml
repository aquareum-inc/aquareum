name: Mobile

# The native apps, each built and tested against a mock-only instance (docs/mobile/plan.md section 14).
# Not required checks until they are stable.
on:
  push:
    branches: [main]
    paths: &mobile
      - "apps/ios/**"
      - "apps/android/**"
      - "packages/mobile-codegen/**"
      - "docs/mobile/openapi.json"
      - "docs/mobile/dev.instance.config.json"
      - "apps/web/lib/public-api/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths: *mobile

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  MOCK_ONLY: "1"
  INSTANCE_CONFIG: docs/mobile/dev.instance.config.json

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Start a mock-only instance
        run: |
          export SESSION_SECRET="$(openssl rand -hex 32)"
          nohup pnpm dev > instance.log 2>&1 &
          curl -fsS --retry 60 --retry-delay 2 --retry-all-errors http://localhost:3100/api/v1/instance > /dev/null
      - name: Metal toolchain, for the home screen's shader
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Pick a simulator
        run: echo "SIMULATOR=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')" >> "$GITHUB_ENV"
      - name: Unit tests
        working-directory: apps/ios
        run: xcodebuild -project Aquareum.xcodeproj -scheme Aquareum -destination "platform=iOS Simulator,id=$SIMULATOR" test
      - name: UI tests
        working-directory: apps/ios
        run: xcodebuild -project Aquareum.xcodeproj -scheme AquareumUITests -destination "platform=iOS Simulator,id=$SIMULATOR" test
      - name: Instance log
        if: failure()
        run: tail -n 200 instance.log

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Start a mock-only instance
        run: |
          export SESSION_SECRET="$(openssl rand -hex 32)"
          nohup pnpm dev > instance.log 2>&1 &
          curl -fsS --retry 60 --retry-delay 2 --retry-all-errors http://localhost:3100/api/v1/instance > /dev/null
      - name: Unit tests
        working-directory: apps/android
        run: ./gradlew testDebugUnitTest
      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Android 17 is published as 37.0 (platforms;android-37.0); quoted so YAML keeps it a string.
          api-level: "37.0"
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: apps/android
          script: ./gradlew connectedDebugAndroidTest
      - name: Instance log
        if: failure()
        run: tail -n 200 instance.log

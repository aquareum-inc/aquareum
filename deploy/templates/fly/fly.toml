# Fly.io: the app only. Run from the repository root:
#   fly launch --copy-config --config deploy/templates/fly/fly.toml --no-deploy
#   fly secrets set SESSION_SECRET=$(openssl rand -base64 32) ENGINE_URL=… ENGINE_READER_TOKEN=… ENGINE_ADMIN_TOKEN=…
#   fly deploy --config deploy/templates/fly/fly.toml
# Without engine secrets, set MOCK_ONLY=1 instead.
primary_region = "iad"

[build]
  dockerfile = "../../../Dockerfile"

[env]
  INSTANCE_CONFIG = "/app/presets/full.json"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    path = "/api/health"
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"
